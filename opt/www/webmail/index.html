<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Email | Infratech Engenharia</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #0f0f0f; color: #e0e0e0; }
header { background: #1a1a1a; border-bottom: 3px solid #E30613; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
header h1 { color: #E30613; font-size: 20px; }
header span { font-size: 12px; color: #888; }
.cards { display: flex; gap: 16px; padding: 20px 24px; flex-wrap: wrap; }
.card { background: #1a1a1a; border-radius: 8px; padding: 20px; flex: 1; min-width: 180px; border-left: 4px solid #E30613; }
.card h3 { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; }
.card .valor { font-size: 32px; font-weight: bold; color: #fff; }
.card.alerta { border-left-color: #ff4444; }
.card.ok { border-left-color: #00cc66; }
.tabs { display: flex; gap: 4px; padding: 0 24px; }
.tab { padding: 10px 20px; background: #1a1a1a; border: none; color: #888; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 14px; }
.tab.active { background: #E30613; color: #fff; }
.tabcontent { display: none; padding: 0 24px 24px; }
.tabcontent.active { display: block; }
table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
th { background: #2a2a2a; padding: 12px 16px; text-align: left; font-size: 12px; color: #888; text-transform: uppercase; }
td { padding: 10px 16px; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
tr:hover td { background: #222; }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
.badge-inbox { background: #1a3a1a; color: #00cc66; }
.badge-spam { background: #3a1a1a; color: #ff4444; }
.status-ok { color: #00cc66; font-weight: bold; }
.status-alerta { color: #ff4444; font-weight: bold; }
.refresh { margin-left: auto; background: #E30613; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.search { padding: 8px 24px; margin-bottom: 8px; }
.search input { width: 100%; padding: 10px 16px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 14px; }
.search input:focus { outline: none; border-color: #E30613; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Monitor de Email -- Infratech Engenharia</h1>
    <span id="atualizado">Carregando...</span>
  </div>
  <button class="refresh" onclick="carregarDados()">Atualizar</button>
</header>
<div class="cards">
  <div class="card" id="card-recebidos"><h3>Recebidos Hoje</h3><div class="valor" id="recebidos-hoje">--</div></div>
  <div class="card" id="card-enviados"><h3>Enviados Hoje</h3><div class="valor" id="enviados-hoje">--</div></div>
  <div class="card" id="card-fila"><h3>Fila</h3><div class="valor" id="fila">--</div></div>
  <div class="card" id="card-ip"><h3>Status IP</h3><div class="valor" id="ip-status">--</div></div>
</div>
<div class="search">
  <input type="text" id="busca" placeholder="Buscar por email, dominio ou msgid..." oninput="filtrar()">
</div>
<div class="tabs">
  <button class="tab active" onclick="mostrarTab('recebidos',this)">Recebidos</button>
  <button class="tab" onclick="mostrarTab('enviados',this)">Enviados Externos</button>
</div>
<div id="tab-recebidos" class="tabcontent active">
  <table><thead><tr><th>Data/Hora</th><th>Destinatario</th><th>Message ID</th><th>Pasta</th></tr></thead><tbody id="tabela-recebidos"></tbody></table>
</div>
<div id="tab-enviados" class="tabcontent">
  <table><thead><tr><th>Data/Hora</th><th>Dominio Destino</th><th>Servidor</th><th>Rcpts</th></tr></thead><tbody id="tabela-enviados"></tbody></table>
</div>
<script>
var dadosGlobais={};
function carregarDados(){
  document.getElementById("atualizado").textContent="Atualizando...";
  fetch("data.json?t="+Date.now()).then(function(r){return r.json();}).then(function(d){
    dadosGlobais=d;
    document.getElementById("atualizado").textContent="Atualizado: "+d.atualizado;
    document.getElementById("recebidos-hoje").textContent=d.recebidos_hoje;
    document.getElementById("enviados-hoje").textContent=d.enviados_hoje;
    document.getElementById("fila").textContent=d.fila;
    var ipCard=document.getElementById("card-ip");
    var ipStatus=document.getElementById("ip-status");
    if(d.ip_bloqueado&&d.ip_bloqueado!=="nenhum"&&d.ip_bloqueado.trim()!==""){
      ipStatus.innerHTML='<span class="status-alerta">BLOQUEADO</span>';
      ipCard.className="card alerta";
    }else{
      ipStatus.innerHTML='<span class="status-ok">OK</span>';
      ipCard.className="card ok";
    }
    document.getElementById("card-fila").className=d.fila>5?"card alerta":"card ok";
    renderTabela(d.recebidos,d.enviados);
  }).catch(function(e){document.getElementById("atualizado").textContent="Erro: "+e.message;});
}
function renderTabela(recebidos,enviados){
  var busca=document.getElementById("busca").value.toLowerCase();
  var tbR=document.getElementById("tabela-recebidos");
  var htmlR="";
  var filtR=recebidos.filter(function(r){return !busca||JSON.stringify(r).toLowerCase().indexOf(busca)>=0;});
  for(var i=0;i<filtR.length;i++){
    var r=filtR[i];
    var cls=r.pasta==="INBOX"?"badge-inbox":"badge-spam";
    htmlR+="<tr><td>"+r.timestamp+"</td><td><b>"+r.destinatario+"</b></td><td style='font-size:11px;color:#888'>"+r.msgid+"</td><td><span class='badge "+cls+"'>"+r.pasta+"</span></td></tr>";
  }
  tbR.innerHTML=htmlR||"<tr><td colspan='4' style='text-align:center;color:#888;padding:20px'>Nenhum resultado</td></tr>";
  var tbE=document.getElementById("tabela-enviados");
  var htmlE="";
  var filtE=enviados.filter(function(e){return !busca||JSON.stringify(e).toLowerCase().indexOf(busca)>=0;});
  for(var j=0;j<filtE.length;j++){
    var ev=filtE[j];
    htmlE+="<tr><td>"+ev.timestamp+"</td><td><b>"+ev.dominio+"</b></td><td style='font-size:11px;color:#888'>"+ev.host+"</td><td>"+ev.rcpts+"</td></tr>";
  }
  tbE.innerHTML=htmlE||"<tr><td colspan='4' style='text-align:center;color:#888;padding:20px'>Nenhum resultado</td></tr>";
}
function filtrar(){if(dadosGlobais.recebidos)renderTabela(dadosGlobais.recebidos,dadosGlobais.enviados);}
function mostrarTab(tab,btn){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  document.querySelectorAll(".tabcontent").forEach(function(t){t.classList.remove("active");});
  document.getElementById("tab-"+tab).classList.add("active");
  btn.classList.add("active");
}
carregarDados();
setInterval(carregarDados,60000);
</script>
</body>
</html>
